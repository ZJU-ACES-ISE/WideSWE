profiles:
  asgiref-hidden:
    repo: asgiref
    workdir: repos/django/asgiref
    command: environment/run_profile.sh asgiref-hidden
    status: ready
    test_files:
    - tests/test_sync_contextvars.py
  django-hidden:
    repo: django
    workdir: repos/django/django
    command: environment/run_profile.sh django-hidden
    public_smoke_command: PYTHONPATH="/workspace/repos/django/asgiref:/workspace/repos/django/django:/workspace/repos/django/django/tests${PYTHONPATH:+:$PYTHONPATH}" python tests/runtests.py signals --verbosity 2
    status: ready
    test_files:
    - tests/signals/tests.py
