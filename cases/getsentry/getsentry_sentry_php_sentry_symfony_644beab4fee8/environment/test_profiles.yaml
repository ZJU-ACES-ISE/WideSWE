profiles:
  sentry_laravel-hidden:
    repo: sentry-laravel
    workdir: repos/getsentry/sentry-laravel
    command: environment/run_profile.sh sentry_laravel-hidden
    status: implemented
    docker_service: getsentry-php-symfony-laravel-logs
    dependency_image: ecosyncbench/deps/getsentry-php-symfony-laravel-logs:644beab4fee8
    persist_vendor: true
    execution_targets:
    - test/Sentry/Features/LogLogsIntegrationTest.php
    - test/Sentry/Laravel/LaravelContainerConfigOptionsTest.php
    test_files:
    - test/Sentry/Features/LogLogsIntegrationTest.php
    - test/Sentry/Laravel/LaravelContainerConfigOptionsTest.php
  sentry_php-hidden:
    repo: sentry-php
    workdir: repos/getsentry/sentry-php
    command: environment/run_profile.sh sentry_php-hidden
    status: implemented
    docker_service: getsentry-php-symfony-laravel-logs
    dependency_image: ecosyncbench/deps/getsentry-php-symfony-laravel-logs:644beab4fee8
    persist_vendor: true
    execution_targets:
    - tests/Logs/LogsAggregatorTest.php
    - tests/OptionsTest.php
    test_files:
    - tests/Logs/LogsAggregatorTest.php
    - tests/OptionsTest.php
  sentry_symfony-hidden:
    repo: sentry-symfony
    workdir: repos/getsentry/sentry-symfony
    command: environment/run_profile.sh sentry_symfony-hidden
    status: implemented
    docker_service: getsentry-php-symfony-laravel-logs
    dependency_image: ecosyncbench/deps/getsentry-php-symfony-laravel-logs:644beab4fee8
    persist_vendor: true
    execution_targets:
    - tests/DependencyInjection
    - tests/End2End/LoggingFlushThresholdEnd2EndTest.php
    test_files:
    - tests/DependencyInjection/ConfigurationTest.php
    - tests/DependencyInjection/Fixtures/php/full.php
    - tests/DependencyInjection/Fixtures/xml/full.xml
    - tests/DependencyInjection/Fixtures/yml/full.yml
    - tests/DependencyInjection/SentryExtensionTest.php
    - tests/End2End/App/config/log_flush_threshold.yml
    - tests/End2End/App/config/log_flush_threshold_null.yml
    - tests/End2End/LoggingFlushThresholdEnd2EndTest.php
