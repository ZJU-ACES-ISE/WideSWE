profiles:
  core-hidden:
    repo: core
    workdir: repos/home-assistant/core
    command: /opt/ecosync/venv/bin/python -m pytest -q -o addopts="" tests/test_backup_restore.py
      --junitxml=/workspace/.ecosyncbench/test-reports/core-hidden.xml
    status: implemented
    docker_service: core-hidden
    dependency_image: ecosyncbench/deps/home-assistant-core-py:4bf3a5b4bd96-paho
    test_files:
    - tests/test_backup_restore.py
    patched_files:
    - tests/test_backup_restore.py
  supervisor-hidden:
    repo: supervisor
    workdir: repos/home-assistant/supervisor
    command: dbus-run-session -- /opt/ecosync/venv/bin/python -m pytest -q -o addopts=""
      tests/backups/test_backup_security.py --junitxml=/workspace/.ecosyncbench/test-reports/supervisor-hidden.xml
    status: implemented
    docker_service: supervisor-hidden
    dependency_image: ecosyncbench/deps/home-assistant-supervisor-py:da800b888974
    test_files:
    - tests/backups/test_backup_security.py
    patched_files:
    - tests/backups/test_backup_security.py
