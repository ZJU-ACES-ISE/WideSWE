profiles:
  core-hidden:
    repo: core
    workdir: repos/home-assistant/core
    command: python -m pytest -q -o addopts="" tests/components/hassio/test_ingress.py --junitxml=/workspace/.ecosyncbench/test-reports/core-hidden.xml
    status: implemented
    docker_service: core-hidden
    dependency_image: ecosyncbench/deps/home-assistant-core-py:beaea2d99806
    test_files:
    - tests/components/hassio/test_ingress.py
  supervisor-hidden:
    repo: supervisor
    workdir: repos/home-assistant/supervisor
    command: dbus-run-session -- python -m pytest -q -o addopts="" tests/api/test_ingress.py --junitxml=/workspace/.ecosyncbench/test-reports/supervisor-hidden.xml
    status: implemented
    docker_service: supervisor-hidden
    dependency_image: ecosyncbench/deps/home-assistant-supervisor-py:7012a8e9bde2
    test_files:
    - tests/api/test_ingress.py
