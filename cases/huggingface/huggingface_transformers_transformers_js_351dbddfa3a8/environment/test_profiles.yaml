profiles:
  transformers-hidden:
    repo: transformers
    workdir: repos/huggingface/transformers
    command: handled by environment/run_profile.sh
    docker_service: transformers-hidden
    dependency_image: ecosyncbench/deps/huggingface-transformers-py:351dbddfa3a8
    status: implemented
    patched_files:
    - tests/models/cohere_asr/__init__.py
    - tests/models/cohere_asr/test_modeling_cohere_asr.py
    test_files:
    - tests/models/cohere_asr/__init__.py
    - tests/models/cohere_asr/test_modeling_cohere_asr.py
  transformers_js-hidden:
    repo: transformers.js
    workdir: repos/huggingface/transformers.js
    command: handled by environment/run_profile.sh
    docker_service: transformers_js-hidden
    dependency_image: ecosyncbench/deps/huggingface-transformers-js-node:351dbddfa3a8
    persist_node_modules: true
    persist_node_modules_paths:
    - .
    - packages/transformers
    status: implemented
    patched_files:
    - packages/transformers/tests/models/cohere_asr/test_feature_extraction_cohere_asr.js
    test_files:
    - packages/transformers/tests/feature_extractors.test.js
    - packages/transformers/tests/models/cohere_asr/test_feature_extraction_cohere_asr.js
