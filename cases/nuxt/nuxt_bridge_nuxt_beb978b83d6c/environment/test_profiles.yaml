profiles:
  bridge-hidden:
    repo: bridge
    workdir: repos/nuxt/bridge
    command: environment/run_profile.sh bridge-hidden
    dependency_image: ecosyncbench/base/node:22-bookworm
    status: manual_profile_ready
    persist_node_modules: true
    persist_node_modules_paths:
    - .
    - packages/bridge
    - packages/bridge-schema
    test_files:
    - packages/bridge/test/composables.nuxt.test.ts
    test_command_files:
    - packages/bridge/test/composables.nuxt.test.ts
  nuxt-hidden:
    repo: nuxt
    workdir: repos/nuxt/nuxt
    command: environment/run_profile.sh nuxt-hidden
    dependency_image: ecosyncbench/base/node:22-bookworm
    status: manual_profile_ready
    persist_node_modules: true
    test_files:
    - test/nuxt/composables.test.ts
    test_command_files:
    - test/nuxt/composables.test.ts
