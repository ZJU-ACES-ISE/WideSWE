profiles:
  kit-hidden:
    repo: kit
    workdir: repos/sveltejs/kit
    persist_node_modules: true
    evaluator_node_modules_mode: persistent
    evaluator_node_modules_paths:
    - .
    - packages/kit
    - packages/kit/test/apps/async
    command: environment/run_profile.sh kit-hidden
    status: implemented
    dependency_image: ecosyncbench/base/sveltejs-node:24
    test_files:
    - packages/kit/src/core/config/index.spec.js
    - packages/kit/test/apps/async/src/hooks.client.js
    - packages/kit/test/apps/async/src/hooks.server.js
    - packages/kit/test/apps/async/src/routes/+error.svelte
