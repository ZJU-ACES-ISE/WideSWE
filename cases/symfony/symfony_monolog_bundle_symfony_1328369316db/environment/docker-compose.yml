services:
  monolog_bundle-hidden:
    image: ecosyncbench/deps/symfony-monolog-bundle-composer:c64ef750c811
    build:
      context: ${ECOSYNC_BUILD_CONTEXT:-.}
      dockerfile: ${ECOSYNC_REPO_ROOT}/benchmark/images/deps/php-composer-project/Dockerfile
      args:
        ECOSYNC_BASE_IMAGE: ecosyncbench/base/php-composer:8.4
        ECOSYNC_TASK_ID: symfony_monolog_bundle_symfony_1328369316db
        ECOSYNC_REPO: symfony/monolog-bundle
        ECOSYNC_REPO_PATH: repos/symfony/monolog-bundle
        ECOSYNC_BASE_COMMIT: c64ef750c81125edbf9c2198f87d5743e544c9f3
        ECOSYNC_DEPENDENCY_FINGERPRINT: c64ef750c811
        ECOSYNC_COMPOSER_ROOT_VERSION: 3.x-dev
    working_dir: /workspace/repos/symfony/monolog-bundle
    volumes:
    - ${ECOSYNC_WORKSPACE:?ECOSYNC_WORKSPACE required}:/workspace
    command: bash -lc 'bash /opt/ecosync/run-phpunit.sh monolog_bundle-hidden tests/DependencyInjection/Compiler/AddProcessorsPassTest.php'

  symfony-hidden:
    image: ecosyncbench/deps/symfony-framework-composer:c87fabb54f64
    build:
      context: ${ECOSYNC_BUILD_CONTEXT:-.}
      dockerfile: ${ECOSYNC_REPO_ROOT}/cases/symfony/symfony_monolog_bundle_symfony_1328369316db/environment/symfony-framework-composer.Dockerfile
      args:
        ECOSYNC_BASE_IMAGE: ecosyncbench/base/php-composer:8.4
        ECOSYNC_TASK_ID: symfony_monolog_bundle_symfony_1328369316db
        ECOSYNC_REPO: symfony/symfony
        ECOSYNC_REPO_PATH: repos/symfony/symfony
        ECOSYNC_BASE_COMMIT: c87fabb54f641b658565a25ae3eb22b59f0ed85f
        ECOSYNC_DEPENDENCY_FINGERPRINT: c87fabb54f64
        ECOSYNC_COMPOSER_ROOT_VERSION: 8.1.x-dev
    working_dir: /workspace/repos/symfony/symfony
    volumes:
    - ${ECOSYNC_WORKSPACE:?ECOSYNC_WORKSPACE required}:/workspace
    command: bash -lc 'bash /opt/ecosync/run-phpunit.sh symfony-hidden src/Symfony/Component/Serializer/Tests/DependencyInjection/SerializerPassTest.php'
